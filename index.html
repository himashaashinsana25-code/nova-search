
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080817">
<meta name="description" content="Nova Search — explore the digital universe.">
<title>Nova Search</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: #f5f7ff;
  background:
    radial-gradient(ellipse at 50% 20%,
      #17113b 0%, #080817 55%, #04040b 100%);
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}

header {
  padding: 23px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  color: #00f5ff;
  font-size: 29px;
  text-shadow: 0 0 15px #00dfff;
}

.brand {
  color: #fff;
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 2px;
}

.tagline {
  margin-top: 5px;
  color: #9295b7;
  font-size: 10px;
  letter-spacing: 2px;
}

main {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 30px 20px 70px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: clamp(37px, 9vw, 62px);
  letter-spacing: -2px;
  background: linear-gradient(90deg, #00f5ff, #fff, #ff38d1);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  color: #a8acc9;
  font-size: 14px;
  line-height: 1.7;
  margin: 18px 0 32px;
}

form {
  display: flex;
  gap: 8px;
  padding: 7px;
  border: 1px solid #00eaff;
  border-radius: 18px;
  background: #101024;
  box-shadow: 0 0 12px #00cfff55,
              0 0 35px #c000ff20;
}

input {
  flex: 1;
  width: 0;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  padding: 12px 8px;
  color: white;
  font-size: 16px;
}

input::placeholder { color: #8588a7; }

button {
  border: 0;
  border-radius: 12px;
  padding: 0 17px;
  color: #050514;
  background: #00f5ff;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button:active { transform: scale(.96); }

.hint {
  color: #777c9e;
  font-size: 12px;
  margin-top: 18px;
}

.shortcuts {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 30px;
}

.shortcuts button {
  color: #c6c9e8;
  background: #15152b;
  border: 1px solid #353456;
  padding: 11px 15px;
  border-radius: 22px;
}

.shortcuts button:hover {
  border-color: #ff38d1;
  color: #ff73df;
}

footer {
  padding: 20px;
  color: #777c9e;
  text-align: center;
  font-size: 11px;
}

footer span { color: #00f5ff; }

@media (max-width: 380px) {
  header { padding: 18px 12px; }
  .brand { font-size: 16px; }
  form { gap: 3px; }
  button { padding: 0 12px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">✧</div>
  <div>
    <div class="brand">NOVA SEARCH</div>
    <div class="tagline">YOUR GATEWAY TO THE WEB</div>
  </div>
</header>

<main>
  <h1>Search beyond.</h1>
  <p class="subtitle">
    One universe. Infinite discoveries.<br>
    What are you looking for?
  </p>

  <form id="searchForm">
    <input id="query" type="search"
      placeholder="Search the universe..."
      aria-label="Search the web"
      autocomplete="off" required>
    <button type="submit">SEARCH ↗</button>
  </form>

  <div class="hint">Press search or hit Enter to explore.</div>

  <div class="shortcuts">
    <button type="button" data-query="Technology news">
      Technology
    </button>
    <button type="button" data-query="Space and astronomy">
      Space
    </button>
    <button type="button" data-query="Learn programming">
      Coding
    </button>
    <button type="button" data-query="Artificial intelligence">
      AI
    </button>
  </div>
</main>

<footer>
  BUILT FOR THE FUTURE · <span>NOVA SEARCH</span>
</footer>

<script>
const form = document.getElementById("searchForm");
const input = document.getElementById("query");

function searchWeb(query) {
  const cleanQuery = query.trim();
  if (!cleanQuery) {
    input.focus();
    return;
  }

  const url =
    "https://duckduckgo.com/?q=" +
    encodeURIComponent(cleanQuery);

  window.location.href = url;
}

form.addEventListener("submit", function(event) {
  event.preventDefault();
  searchWeb(input.value);
});

document.querySelectorAll("[data-query]").forEach(function(button) {
  button.addEventListener("click", function() {
    searchWeb(button.dataset.query);
  });
});
</script>
</body>
</html>
